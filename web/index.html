<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!--
      SEO block. The Go server replaces everything between the two markers with
      per-route tags (title, description, canonical, Open Graph, JSON-LD) before
      sending index.html. Keep the markers when editing this file.
    -->
    <!--seo:start-->
    <title>TokenCome 杜康 · AI 大模型 API 网关</title>
    <meta
      name="description"
      content="TokenCome（杜康）是面向开发者的 AI 大模型 API 网关：一个 Base URL 同时兼容 OpenAI、Anthropic Claude 与 Google Gemini 协议。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://tokencome.org/" />
    <!--seo:end-->

    <meta
      name="theme-color"
      content="#f8fafc"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1020"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate"></div>
  </body>
</html>
